# Build and upload a release to CurseForge (and GitHub Releases) when a version tag is pushed.
# Tags containing "beta" or "alpha" (e.g. v0.1.0-beta) are uploaded with that release type.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager builds the changelog from history

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
